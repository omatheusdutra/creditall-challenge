services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: creditall-app
    working_dir: /var/www/html
    command: sh -c "php artisan storage:link >/dev/null 2>&1 || true && php artisan serve --host=0.0.0.0 --port=8000"
    volumes:
      - ./:/var/www/html
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: creditall-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-creditall}
      MYSQL_USER: ${DB_USERNAME:-creditall}
      MYSQL_PASSWORD: ${DB_PASSWORD:-creditall}
    ports:
      - "${FORWARD_DB_PORT:-33060}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  e2e:
    image: mcr.microsoft.com/playwright:v1.58.2-jammy
    working_dir: /work
    command: sleep infinity
    volumes:
      - ./:/work
      - e2e-node-modules:/work/node_modules
    environment:
      PLAYWRIGHT_BASE_URL: http://creditall-app:8000
      CI: "1"
    ipc: host
    depends_on:
      app:
        condition: service_started

volumes:
  mysql-data:
  e2e-node-modules:
